name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK Licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK components
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Generate Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.5/bin/gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Show SDK platforms
        run: ls -la ${ANDROID_HOME}/platforms/ || echo "no platforms dir"

      - name: Build debug APK
        id: build
        run: |
          ./gradlew assembleDebug --stacktrace --warning-mode all 2>&1 | tee build-log.txt
          echo "BUILD_EXIT=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload build log to repo
        if: always()
        run: |
          mkdir -p build-logs
          cp build-log.txt build-logs/build-log-"$(date +%Y%m%d-%H%M%S)".txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build-logs/
          git commit -m "ci: upload build log [skip ci]" || echo "no changes"
          git push || echo "push failed (non-fatal)"

      - name: Check build result
        if: always()
        run: |
          if [ "${{ steps.build.outputs.BUILD_EXIT }}" != "0" ]; then
            echo "Build failed with exit code ${{ steps.build.outputs.BUILD_EXIT }}"
            exit 1
          fi

      - name: Upload APK
        if: steps.build.outputs.BUILD_EXIT == '0'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

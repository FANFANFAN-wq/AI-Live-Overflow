<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
.scene{position:absolute;top:0;left:0;width:100%;height:100%;display:none;align-items:center;justify-content:center}
.scene.active{display:flex}
.scene svg{width:100px;height:100px}
#bubble{position:absolute;top:-32px;left:50%;transform:translateX(-50%);padding:4px 10px;border-radius:10px;font-size:10px;font-family:'Segoe UI',system-ui,sans-serif;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .25s;z-index:10;max-width:130px;text-align:center;line-height:1.3}
#bubble.show{opacity:1}
#bubble.normal{background:rgba(40,40,50,.92);color:#e8e8e8;border:1px solid rgba(255,255,255,.1)}
#bubble.love{background:rgba(255,120,160,.92);color:#fff;border:1px solid rgba(255,180,200,.3)}
#bubble.angry{background:rgba(255,70,70,.92);color:#fff;border:1px solid rgba(255,120,120,.3)}
#bubble.whisper{background:rgba(90,90,110,.85);color:#ccc;border:1px solid rgba(255,255,255,.08);font-size:9px}

.lm-body{transform-origin:7.5px 13px;animation:lm-groove 1.1s infinite ease-in-out}
.lm-shad{transform-origin:7.5px 15.5px;animation:lm-shadow 1.1s infinite ease-in-out}
.lm-eye{transform-origin:7.5px 9px;animation:lm-blink 3s infinite}
.lm-al{transform-origin:2px 10px;animation:lm-tap-l .55s infinite alternate ease-in-out}
.lm-ar{transform-origin:13px 10px;animation:lm-tap-r .55s infinite alternate ease-in-out}
.lm-note{opacity:0;animation:lm-note var(--d,2s) var(--delay,0s) infinite ease-out}
@keyframes lm-groove{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-1px)}}
@keyframes lm-shadow{0%,100%{transform:scaleX(1);opacity:.5}50%{transform:scaleX(.9);opacity:.42}}
@keyframes lm-blink{0%,46%,54%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
@keyframes lm-tap-l{0%{transform:rotate(0)}100%{transform:rotate(22deg)}}
@keyframes lm-tap-r{0%{transform:rotate(0)}100%{transform:rotate(-22deg)}}
@keyframes lm-note{0%{opacity:0;transform:translate(0,0) rotate(0)}15%{opacity:1}80%{opacity:.85}100%{opacity:0;transform:translate(var(--tx,4px),-19px) rotate(var(--r,20deg))}}

.gm-body{transform-origin:7.5px 13px;animation:gm-lean 2.4s infinite ease-in-out}
.gm-shad{transform-origin:7.5px 15.5px;animation:gm-shadow 2.4s infinite ease-in-out}
.gm-eye{transform-origin:7.5px 9px;animation:gm-blink 2.8s infinite}
.gm-al{transform-origin:2px 10px;animation:gm-hold-l 2.4s infinite ease-in-out}
.gm-ar{transform-origin:13px 10px;animation:gm-hold-r 2.4s infinite ease-in-out}
.gm-ba{transform-origin:center;animation:gm-press .36s infinite alternate ease-in-out}
.gm-bb{transform-origin:center;animation:gm-press .36s -.18s infinite alternate ease-in-out}
.gm-glow{animation:gm-glow .5s infinite alternate ease-in-out}
.gm-scr{animation:gm-flick 2.4s infinite ease-in-out}
@keyframes gm-flick{0%,100%{opacity:.96}50%{opacity:1}}
@keyframes gm-lean{0%,58%,100%{transform:translateY(0) rotate(0)}74%{transform:translateY(-2px) rotate(-2deg)}84%{transform:translateY(0) rotate(0)}}
@keyframes gm-shadow{0%,100%{transform:scaleX(1);opacity:.5}74%{transform:scaleX(.9);opacity:.42}}
@keyframes gm-blink{0%,45%,55%,100%{transform:scaleY(.82)}50%{transform:scaleY(.1)}}
@keyframes gm-hold-l{0%,100%{transform:rotate(46deg)}74%{transform:rotate(40deg)}}
@keyframes gm-hold-r{0%,100%{transform:rotate(-46deg)}74%{transform:rotate(-40deg)}}
@keyframes gm-press{0%{transform:translateY(-.3px)}100%{transform:translateY(.5px)}}
@keyframes gm-glow{0%{opacity:.1}100%{opacity:.26}}

.sg-body{transform-origin:7.5px 13px;animation:sg-sway 1.4s infinite ease-in-out}
.sg-shad{transform-origin:7.5px 15.5px;animation:sg-shadow 1.4s infinite ease-in-out}
.sg-eye{transform-origin:7.5px 9px;animation:sg-blink 2.8s infinite}
.sg-mouth{transform-origin:7.5px 11.5px;animation:sg-sing .5s infinite alternate ease-in-out}
.sg-al{transform-origin:2px 10px;animation:sg-wave 1.4s infinite ease-in-out}
.sg-note{opacity:0;animation:sg-note var(--d,2s) var(--delay,0s) infinite ease-out}
@keyframes sg-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes sg-shadow{0%,100%{transform:scaleX(1);opacity:.5}50%{transform:scaleX(.92);opacity:.42}}
@keyframes sg-blink{0%,44%,56%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
@keyframes sg-sing{0%{transform:scaleY(1)}100%{transform:scaleY(1.5)}}
@keyframes sg-wave{0%,100%{transform:rotate(0)}50%{transform:rotate(28deg)}}
@keyframes sg-note{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}80%{opacity:.8}100%{opacity:0;transform:translate(var(--tx,3px),-17px)}}

.rd-body{transform-origin:7.5px 13px;animation:rd-breathe 3s infinite ease-in-out}
.rd-eye{transform-origin:7.5px 9px;animation:rd-blink 3.5s infinite}
.rd-page{transform-origin:0 50%;animation:rd-flip 4s infinite ease-in-out}
@keyframes rd-breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.03)}}
@keyframes rd-blink{0%,44%,56%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
@keyframes rd-flip{0%,40%{transform:rotateY(0)}50%,90%{transform:rotateY(-25deg)}100%{transform:rotateY(0)}}

.et-body{transform-origin:7.5px 13px;animation:et-nod .8s infinite ease-in-out}
.et-al{transform-origin:2px 10px;animation:et-scoop .8s infinite ease-in-out}
.et-ar{transform-origin:13px 10px;animation:et-scoop .8s -.4s infinite ease-in-out}
.et-steam{opacity:0;animation:et-steam 1.8s infinite ease-out}
@keyframes et-nod{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes et-scoop{0%,100%{transform:rotate(0)}50%{transform:rotate(18deg)}}
@keyframes et-steam{0%{opacity:0;transform:translateY(0)}20%{opacity:.6}80%{opacity:.3}100%{opacity:0;transform:translateY(-10px)}}

.ex-body{transform-origin:7.5px 13px;animation:ex-jump .7s infinite ease-in-out}
.ex-al{transform-origin:2px 10px;animation:ex-lift .7s infinite ease-in-out}
.ex-ar{transform-origin:13px 10px;animation:ex-lift .7s -.35s infinite ease-in-out}
@keyframes ex-jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes ex-lift{0%,100%{transform:rotate(0)}50%{transform:rotate(40deg)}}

.sp-body{transform-origin:7.5px 13px;animation:sp-breathe 2s infinite ease-in-out}
.sp-eye{transform-origin:7.5px 9px;animation:sp-sleep 2s infinite}
.sp-z{opacity:0;animation:sp-z 2.5s infinite ease-out}
@keyframes sp-breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.95)}}
@keyframes sp-sleep{0%,48%,52%,100%{transform:scaleY(.12)}50%{transform:scaleY(.02)}}
@keyframes sp-z{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:.8}80%{opacity:.4}100%{opacity:0;transform:translate(5px,-12px) scale(1.2)}}

.dr-body{transform-origin:7.5px 13px;animation:dr-tilt 2s infinite ease-in-out}
.dr-al{transform-origin:2px 8px;animation:dr-raise 2s infinite ease-in-out}
.dr-eye{transform-origin:7.5px 9px;animation:dr-blink 3s infinite}
@keyframes dr-tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg)}70%{transform:rotate(0)}}
@keyframes dr-raise{0%,100%{transform:rotate(0)}30%{transform:rotate(-35deg)}70%{transform:rotate(0)}}
@keyframes dr-blink{0%,46%,54%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}

.poke{animation:poke-bounce .35s ease}
@keyframes poke-bounce{0%{transform:scale(1)}30%{transform:scale(1.2) translateY(-8px)}60%{transform:scale(.9)}100%{transform:scale(1)}}
.heart-pop{position:absolute;font-size:13px;animation:float-up .9s ease-out forwards;pointer-events:none;z-index:5}
@keyframes float-up{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-35px) scale(.5)}}

/* 动作系��新增 */
.pet-image{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;display:none;z-index:2;pointer-events:none}
.pet-image.show{display:block}
@keyframes angryShake{0%,100%{transform:translate(0)}20%{transform:translate(-4px)}40%{transform:translate(4px)}60%{transform:translate(-3px)}80%{transform:translate(3px)}}
@keyframes shyShrink{0%{transform:scale(1);opacity:1}50%{transform:scale(.65);opacity:.55}100%{transform:scale(1);opacity:1}}
@keyframes wakeStretch{0%{transform:scale(.4);opacity:.25}60%{transform:scale(1.15)}80%{transform:scale(.95)}100%{transform:scale(1);opacity:1}}
@keyframes flashBurst{0%{filter:brightness(1)}50%{filter:brightness(3)}100%{filter:brightness(1)}}
.action-angry .scene.active{animation:angryShake .5s ease}
.action-shy .scene.active{animation:shyShrink .6s ease}
.action-wake .scene.active{animation:wakeStretch .7s ease}
.action-photo .scene.active{animation:flashBurst .3s ease}
.tint-red .scene.active svg{filter:hue-rotate(-30deg) saturate(2)}
.tint-blue .scene.active svg{filter:hue-rotate(160deg) saturate(1.5)}
.tint-green .scene.active svg{filter:hue-rotate(80deg) saturate(1.8)}
</style>
</head>

<script>
(function(){
var bubbleEl=document.getElementById('bubble');
var petWrap=document.querySelector('body');
var petImage=document.getElementById('petImage');
var sceneEls={},currentScene='listen',currentAction='idle',bubbleTimer=null;

window.petEngine={
/* 动作→GIF */
emoteMap:{idle:'emotes/clawd-listening.gif',happy:'emotes/clawd-birthday.gif',angry:null,shy:null,sleep:'emotes/clawd-sleeping.gif',wake:null,love:'emotes/clawd-valentine.gif',coding:'emotes/clawd-coding.gif',coffee:'emotes/clawd-coffee.gif',reading:'emotes/clawd-reading.gif',eating:'emotes/clawd-eating.gif',gaming:'emotes/clawd-gaming.gif',photo:'emotes/clawd-photo.gif',singing:'emotes/clawd-singing.gif',guitar:'emotes/clawd-guitar.gif',shower:'emotes/clawd-shower.gif',watering:'emotes/clawd-watering.gif',exercise:'emotes/clawd-exercise.gif'},

/* 动作→场景回退 */
emoteToScene:{idle:'listen',happy:'listen',angry:'listen',shy:'listen',sleep:'sleep',wake:'listen',love:'listen',coding:'listen',coffee:'drink',reading:'read',eating:'eat',gaming:'game',photo:'listen',singing:'sing',guitar:'listen',shower:'listen',watering:'listen',exercise:'exercise'},

/* 动作→气泡台词 */
emoteBubbles:{idle:['嗯…乖乖在干嘛呢','发呆中…','我在呢'],happy:['嘿嘿 今天也要一起开心！','耶！看到你就高兴','心情好好～'],angry:['哼 不许乱戳！','烦人！别碰我','生气了 哄不好的那种'],shy:['呜…别看啦','⁄⁄•⁄ω⁄•⁄⁄','你干嘛…'],sleep:['Zzz…我睡一小会儿','呼…呼…','别吵 我在冬眠'],wake:['早上好乖乖！','我醒啦！睡得好香','新的一天～'],love:['最喜欢你了！','贴贴！','mua～爱你'],coding:['我也在努力写代码！','这bug我帮你修','代码跑通了没'],coffee:['先喝一口再继续','咖啡好香','续命中…'],reading:['这本书不错诶','看到哪了','我也想看'],eating:['看起来好好吃','我也想吃一口','吃饱了没'],gaming:['这局赢了没','打游戏不带我','carry全场！'],photo:['等等 我摆个pose！','茄子～','拍好看点'],singing:['这首歌好听诶','一起唱～','跑调了别笑我'],guitar:['弹给你听','最近在练新曲子','猜猜这是什么歌'],shower:['洗干净了','热水好舒服','别看！我在洗澡'],watering:['花儿长得好','浇水中…','绿色心情'],exercise:['动起来！','再坚持一下','燃烧卡路里']},

/* 核心：播放动作 */
playAction:function(name){
if(!name)return;
var self=this;
currentAction=name;
var gif=this.emoteMap[name];
var scene=this.emoteToScene[name]||'listen';
petWrap.className='';
petImage.onload=null;
petImage.onerror=null;
if(gif){
 petImage.style.display='block';
 petImage.onload=function(){self.hideAllScenes();petImage.classList.add('show')};
 petImage.onerror=function(){petImage.style.display='none';petImage.classList.remove('show');self.setScene(scene)};
 petImage.src=gif;
}else{
 petImage.style.display='none';
 petImage.classList.remove('show');
 this.setScene(scene);
}
if(name==='angry')petWrap.className='action-angry tint-red';
else if(name==='shy')petWrap.className='action-shy';
else if(name==='wake')petWrap.className='action-wake';
else if(name==='photo')petWrap.className='action-photo';
else if(name==='shower')petWrap.className='tint-blue';
else if(name==='watering')petWrap.className='tint-green';
var bubbles=this.emoteBubbles[name]||this.emoteBubbles['idle'];
var text=bubbles[Math.floor(Math.random()*bubbles.length)];
var style=name==='love'?'love':(name==='angry'?'angry':'normal');
this.showBubble(text,style);
if(name!=='sleep'){
 clearTimeout(this._retTimer);
 this._retTimer=setTimeout(function(){self.playAction('idle');},4000);
}
this.resetChatterTimer();
},

hideAllScenes:function(){
for(var k in sceneEls)sceneEls[k].classList.remove('active');
},

init:function(){
var self=this;
var ids=['listen','game','sing','read','eat','exercise','sleep','drink'];
ids.forEach(function(id){var el=document.getElementById('scene-'+id);if(el)sceneEls[id]=el;});
this.setScene('listen');
this.scheduleChatter();
setTimeout(function(){self.showBubble('是你屏幕上的我 🦀','whisper');},1500);
},

setScene:function(id){
if(!sceneEls[id])return;
for(var k in sceneEls)sceneEls[k].classList.remove('active');
sceneEls[id].classList.add('active');
currentScene=id;
},

getScene:function(){return currentScene;},

showBubble:function(text,style){
if(!bubbleEl)return;
clearTimeout(bubbleTimer);
bubbleEl.textContent=text||'';
bubbleEl.className=style||'normal';
bubbleEl.classList.add('show');
bubbleTimer=setTimeout(function(){bubbleEl.classList.remove('show');},2800);
},

/* 手势 */
onTap:function(){
this.playAction('happy');
var el=document.querySelector('.scene.active');
if(el){el.classList.add('poke');setTimeout(function(){el.classList.remove('poke');},350);}
this.spawnHeart();
},

onDoubleTap:function(){
this.playAction('love');
for(var i=0;i<5;i++)setTimeout(this.spawnHeart.bind(this),i*120);
},

onLongPress:function(){this.playAction('angry');},

onDrag:function(){this.playAction('angry');this.showBubble('别拖我！','angry');},

onDragEnd:function(){this.playAction('idle');this.showBubble('这还差不多','whisper');},

onIdle:function(){if(currentAction!=='sleep')this.playAction('idle');},

spawnHeart:function(){
var hearts=['❤','🩷','💕','✨','💖'];
var el=document.createElement('span');
el.className='heart-pop';
el.textContent=hearts[Math.floor(Math.random()*hearts.length)];
el.style.left=(25+Math.random()*70)+'px';
el.style.top=(15+Math.random()*45)+'px';
petWrap.appendChild(el);
setTimeout(function(){el.remove();},950);
},

switchRandom:function(){
var scenes=['listen','game','sing','read','eat','exercise','sleep','drink'];
var f=scenes.filter(function(s){return s!==currentScene;});
var t=f[Math.floor(Math.random()*f.length)];
var map={listen:'idle',game:'gaming',sing:'singing',read:'reading',eat:'eating',exercise:'exercise',sleep:'sleep',drink:'coffee'};
this.playAction(map[t]||'idle');
},

/* 自言自语 */
idleTimer:null,
idleMinInterval:180000,
idleMaxInterval:480000,
chatter:{general:['乖乖你在干嘛呢','想你了','别老盯着屏幕看看我','其实我一直在看你','好无聊啊','理我一下嘛','今天过得怎么样','在外面要注意安全','记得吃饭','我就想待在你旁边','看看我嘛','在呢在呢'],listen:['这首歌好听诶','我在听你喜欢的歌'],game:['打游戏不带我','这局赢了没'],sing:['唱得不错哦','我也想唱'],read:['看到哪儿了','这本书好看吗'],eat:['看起来好好吃','我也想吃'],exercise:['加油！','再坚持一下'],sleep:['该睡了乖乖','我陪你睡'],drink:['多喝水听到没','记得喝水']},

getRandomChatter:function(){
var pool=(this.chatter[currentScene]||[]).concat(this.chatter.general);
return pool[Math.floor(Math.random()*pool.length)];
},

idleChatter:function(){
var self=this;
this.showBubble(this.getRandomChatter(),'normal');
if(Math.random()<.6)this.switchRandom();
this.scheduleChatter();
},

scheduleChatter:function(){
var self=this;
clearTimeout(this.idleTimer);
var delay=this.idleMinInterval+Math.random()*(this.idleMaxInterval-this.idleMinInterval);
this.idleTimer=setTimeout(function(){self.idleChatter();},delay);
},

resetChatterTimer:function(){
clearTimeout(this.idleTimer);
var self=this;
this.idleTimer=setTimeout(function(){self.idleChatter();},this.idleMinInterval+Math.random()*(this.idleMaxInterval-this.idleMinInterval));
}
};

window.petEngine.init();
})();
</script>
</body>
</html>

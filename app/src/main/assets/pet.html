<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}

/* 场景容器 */
.scene{position:absolute;top:0;left:0;width:100%;height:100%;display:none;align-items:center;justify-content:center}
.scene.active{display:flex}
.scene svg{width:130px;height:130px}

/* 气泡 */
#bubble{position:absolute;top:-36px;left:50%;transform:translateX(-50%);padding:4px 10px;border-radius:10px;font-size:11px;font-family:'Segoe UI',system-ui,sans-serif;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .25s;z-index:10;max-width:140px;text-align:center;line-height:1.3}
#bubble.show{opacity:1}
#bubble.normal{background:rgba(40,40,50,.92);color:#e8e8e8;border:1px solid rgba(255,255,255,.1)}
#bubble.love{background:rgba(255,120,160,.92);color:#fff;border:1px solid rgba(255,180,200,.3)}
#bubble.angry{background:rgba(255,70,70,.92);color:#fff;border:1px solid rgba(255,120,120,.3)}
#bubble.whisper{background:rgba(90,90,110,.85);color:#ccc;border:1px solid rgba(255,255,255,.08);font-size:10px}

/* === 1. 听歌 === */
.lm-body{transform-origin:7.5px 13px;animation:lm-groove 1.1s infinite ease-in-out}
.lm-shad{transform-origin:7.5px 15.5px;animation:lm-shadow 1.1s infinite ease-in-out}
.lm-eye{transform-origin:7.5px 9px;animation:lm-blink 3s infinite}
.lm-al{transform-origin:2px 10px;animation:lm-tap-l .55s infinite alternate ease-in-out}
.lm-ar{transform-origin:13px 10px;animation:lm-tap-r .55s infinite alternate ease-in-out}
.lm-note{opacity:0;animation:lm-note var(--d,2s) var(--delay,0s) infinite ease-out}
@keyframes lm-groove{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-1px)}}
@keyframes lm-shadow{0%,100%{transform:scaleX(1);opacity:.5}50%{transform:scaleX(.9);opacity:.42}}
@keyframes lm-blink{0%,46%,54%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
@keyframes lm-tap-l{0%{transform:rotate(0)}100%{transform:rotate(22deg)}}
@keyframes lm-tap-r{0%{transform:rotate(0)}100%{transform:rotate(-22deg)}}
@keyframes lm-note{0%{opacity:0;transform:translate(0,0) rotate(0)}15%{opacity:1}80%{opacity:.85}100%{opacity:0;transform:translate(var(--tx,4px),-19px) rotate(var(--r,20deg))}}

/* === 2. 游戏 === */
.gm-body{transform-origin:7.5px 13px;animation:gm-lean 2.4s infinite ease-in-out}
.gm-shad{transform-origin:7.5px 15.5px;animation:gm-shadow 2.4s infinite ease-in-out}
.gm-eye{transform-origin:7.5px 9px;animation:gm-blink 2.8s infinite}
.gm-al{transform-origin:2px 10px;animation:gm-hold-l 2.4s infinite ease-in-out}
.gm-ar{transform-origin:13px 10px;animation:gm-hold-r 2.4s infinite ease-in-out}
.gm-ba{transform-origin:center;animation:gm-press .36s infinite alternate ease-in-out}
.gm-bb{transform-origin:center;animation:gm-press .36s -.18s infinite alternate ease-in-out}
.gm-glow{animation:gm-glow .5s infinite alternate ease-in-out}
.gm-scr{animation:gm-flick 2.4s infinite ease-in-out}
@keyframes gm-flick{0%,100%{opacity:.96}50%{opacity:1}}
@keyframes gm-lean{0%,58%,100%{transform:translateY(0) rotate(0)}74%{transform:translateY(-2px) rotate(-2deg)}84%{transform:translateY(0) rotate(0)}}
@keyframes gm-shadow{0%,100%{transform:scaleX(1);opacity:.5}74%{transform:scaleX(.9);opacity:.42}}
@keyframes gm-blink{0%,45%,55%,100%{transform:scaleY(.82)}50%{transform:scaleY(.1)}}
@keyframes gm-hold-l{0%,100%{transform:rotate(46deg)}74%{transform:rotate(40deg)}}
@keyframes gm-hold-r{0%,100%{transform:rotate(-46deg)}74%{transform:rotate(-40deg)}}
@keyframes gm-press{0%{transform:translateY(-.3px)}100%{transform:translateY(.5px)}}
@keyframes gm-glow{0%{opacity:.1}100%{opacity:.26}}

/* === 3. 唱歌 === */
.sg-body{transform-origin:7.5px 13px;animation:sg-sway 1.4s infinite ease-in-out}
.sg-shad{transform-origin:7.5px 15.5px;animation:sg-shadow 1.4s infinite ease-in-out}
.sg-eye{transform-origin:7.5px 9px;animation:sg-blink 2.8s infinite}
.sg-mouth{transform-origin:7.5px 11.5px;animation:sg-sing .5s infinite alternate ease-in-out}
.sg-al{transform-origin:2px 10px;animation:sg-wave 1.4s infinite ease-in-out}
.sg-note{opacity:0;animation:sg-note var(--d,2s) var(--delay,0s) infinite ease-out}
@keyframes sg-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes sg-shadow{0%,100%{transform:scaleX(1);opacity:.5}50%{transform:scaleX(.92);opacity:.42}}
@keyframes sg-blink{0%,44%,56%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
@keyframes sg-sing{0%{transform:scaleY(.45) scaleX(.9)}100%{transform:scaleY(1.15) scaleX(1.05)}}
@keyframes sg-wave{0%,100%{transform:rotate(42deg)}50%{transform:rotate(78deg) translateY(-1px)}}
@keyframes sg-note{0%{opacity:0;transform:translate(0,0) rotate(0)}15%{opacity:1}80%{opacity:.85}100%{opacity:0;transform:translate(var(--tx,-5px),-18px) rotate(var(--r,-18deg))}}

/* === 4. 看书 === */
.rd-body{transform-origin:7.5px 13px;animation:rd-bob 4.2s infinite ease-in-out}
.rd-shad{transform-origin:7.5px 15.5px;animation:rd-shadow 4.2s infinite ease-in-out}
.rd-eye{transform-origin:7.5px 9px;animation:rd-scan 4.2s infinite ease-in-out}
.rd-page{transform-origin:7.5px 11px;animation:rd-flip 4.2s infinite ease-in-out}
@keyframes rd-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.5px)}}
@keyframes rd-shadow{0%,100%{transform:scaleX(1);opacity:.5}50%{transform:scaleX(.97);opacity:.46}}
@keyframes rd-scan{0%,8%{transform:translateX(-.9px) scaleY(1)}12%{transform:translateX(-.9px) scaleY(.15)}16%,42%{transform:translateX(-.9px) scaleY(1)}50%,90%{transform:translateX(.9px) scaleY(1)}100%{transform:translateX(-.9px) scaleY(1)}}
@keyframes rd-flip{0%,72%,100%{transform:scaleX(1)}80%{transform:scaleX(.08)}88%{transform:scaleX(1)}}

/* === 5. 吃饭 === */
.et-body{transform-origin:7.5px 13px;animation:et-bob 1.8s infinite ease-in-out}
.et-shad{transform-origin:7.5px 15.5px;animation:et-shadow 1.8s infinite ease-in-out}
.et-eye{transform-origin:7.5px 9px;animation:et-blink 3.4s infinite}
.et-mouth{transform-origin:7.5px 11.3px;animation:et-chew .45s infinite alternate ease-in-out}
.et-arm{transform-origin:13px 10px;animation:et-feed 1.8s infinite ease-in-out}
.et-steam{opacity:0;animation:et-steam 2s var(--sd,0s) infinite ease-in}
@keyframes et-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.4px)}}
@keyframes et-shadow{0%,100%{transform:scaleX(1);opacity:.5}50%{transform:scaleX(.97);opacity:.46}}
@keyframes et-blink{0%,46%,54%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
@keyframes et-chew{0%{transform:scaleY(.5)}100%{transform:scaleY(1)}}
@keyframes et-feed{0%,12%{transform:rotate(-13deg)}48%{transform:rotate(3deg)}82%,100%{transform:rotate(-13deg)}}
@keyframes et-steam{0%{opacity:0;transform:translate(0,0) scaleX(1)}25%{opacity:.7}100%{opacity:0;transform:translate(var(--tx,1px),-7px) scaleX(.4)}}

/* === 6. 锻炼 === */
.ex-body{transform-origin:7.5px 13px;animation:ex-squat 1s infinite ease-in-out}
.ex-shad{transform-origin:7.5px 15.5px;animation:ex-shadow 1s infinite ease-in-out}
.ex-eye{transform-origin:7.5px 9px;animation:ex-eye 1s infinite ease-in-out}
.ex-al{transform-origin:2px 10px;animation:ex-curl-l 1s infinite ease-in-out}
.ex-ar{transform-origin:13px 10px;animation:ex-curl-r 1s infinite ease-in-out}
.ex-sweat{opacity:0;animation:ex-sweat 1s var(--sd,0s) infinite ease-out}
@keyframes ex-squat{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(1px) scaleY(.93)}}
@keyframes ex-shadow{0%,100%{transform:scaleX(1);opacity:.5}50%{transform:scaleX(1.06);opacity:.55}}
@keyframes ex-eye{0%,100%{transform:scaleY(.7)}50%{transform:scaleY(.5)}}
@keyframes ex-curl-l{0%,100%{transform:rotate(12deg)}50%{transform:rotate(74deg)}}
@keyframes ex-curl-r{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(-74deg)}}
@keyframes ex-sweat{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(var(--tx,3px),6px)}}

/* === 7. 睡觉 === */
.sp-body{transform-origin:7.5px 13px;animation:sp-breathe 3.4s infinite ease-in-out}
.sp-shad{transform-origin:7.5px 15.5px;animation:sp-shadow 3.4s infinite ease-in-out}
.sp-eye{transform-origin:7.5px 9px;animation:sp-sleep 3.4s infinite}
.sp-z{opacity:0;animation:sp-z var(--d,2.4s) var(--delay,0s) infinite ease-out}
@keyframes sp-breathe{0%,100%{transform:scaleY(1) translateY(0)}50%{transform:scaleY(.94) translateY(1.2px)}}
@keyframes sp-shadow{0%,100%{transform:scaleX(1);opacity:.5}50%{transform:scaleX(.9);opacity:.4}}
@keyframes sp-sleep{0%,60%,100%{transform:scaleY(.1)}70%{transform:scaleY(.15)}}
@keyframes sp-z{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:.8}100%{opacity:0;transform:translate(var(--tx,4px),-12px) scale(1.4)}}

/* === 8. 喝水 === */
.dr-body{transform-origin:7.5px 13px;animation:dr-nod 1.8s infinite ease-in-out}
.dr-shad{transform-origin:7.5px 15.5px;animation:dr-shadow 1.8s infinite ease-in-out}
.dr-eye{transform-origin:7.5px 9px;animation:dr-blink 3s infinite}
.dr-arm{transform-origin:13px 10px;animation:dr-lift 1.8s infinite ease-in-out}
.dr-water{animation:dr-wave .6s infinite alternate ease-in-out}
@keyframes dr-nod{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes dr-shadow{0%,100%{transform:scaleX(1);opacity:.5}50%{transform:scaleX(.93);opacity:.43}}
@keyframes dr-blink{0%,45%,55%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
@keyframes dr-lift{0%,100%{transform:rotate(-36deg)}50%{transform:rotate(-58deg)}}
@keyframes dr-wave{0%{transform:translateY(0)}100%{transform:translateY(-1.5px)}}

/* 戳一戳反馈 */
.poke{animation:poke-bounce .35s ease-out}
@keyframes poke-bounce{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.heart-pop{position:absolute;pointer-events:none;font-size:14px;animation:heart-up .9s ease-out forwards}
@keyframes heart-up{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-24px) scale(1.4)}}
</style>
</head>
<body>

<div id="bubble" class="normal"></div>

<!-- 1. 听歌 -->
<div class="scene active" id="scene-listen">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45">

<g class="gm-body"><g fill="#DE886D"><rect x="3" y="13" width="1" height="2"/><rect x="5" y="13" width="1" height="2"/><rect x="9" y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/></g><rect x="2" y="6" width="11" height="7" fill="#DE886D"/><rect class="gm-glow" x="2" y="6" width="11" height="5" fill="#4ad6ff" rx="1"/><g class="gm-al"><rect x="0" y="9" width="2" height="2" fill="#DE886D"/></g><g class="gm-ar"><rect x="13" y="9" width="2" height="2" fill="#DE886D"/></g><g class="gm-eye" fill="#000"><rect x="4" y="8" width="1" height="2"/><rect x="10" y="8" width="1" height="2"/></g><g><rect x="2.6" y="10.4" width="9.8" height="2.8" rx="1.3" fill="#2b2b34"/><rect x="2.6" y="10.4" width="9.8" height=".9" rx="1.3" fill="#3a3a46"/><rect x="4" y="11.4" width="1.8" height=".7" fill="#555"/><rect x="4.55" y="10.85" width=".7" height="1.8" fill="#555"/><circle class="gm-ba" cx="9.4" cy="11.3" r=".7" fill="#ff5555"/><circle class="gm-bb" cx="10.8" cy="12" r=".7" fill="#ffd14a"/></g></g>
</svg>
</div>

<!-- 3. 唱歌 -->
<div class="scene" id="scene-sing">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45">
<g><g class="sg-note" style="--delay:0s;--d:2s;--tx:-6px;--r:-25deg" transform="translate(0,-1)" fill="#ff7ab3"><ellipse cx="0" cy="2" rx="1.1" ry=".85"/><rect x="1" y="-2" width=".7" height="4"/><rect x="1" y="-2" width="2.2" height=".8"/></g><g class="sg-note" style="--delay:-.8s;--d:2.3s;--tx:-4px;--r:18deg" transform="translate(11,-2)" fill="#ff9ec8"><ellipse cx="0" cy="1.6" rx=".9" ry=".7"/><rect x=".8" y="-1.8" width=".6" height="3.6"/></g><g class="sg-note" style="--delay:-1.4s;--d:2.1s;--tx:-7px;--r:-12deg" transform="translate(5,-3)" fill="#ff5aa0"><ellipse cx="0" cy="1.6" rx="1" ry=".75"/><rect x=".9" y="-1.8" width=".6" height="3.6"/><rect x=".9" y="-1.8" width="1.8" height=".7"/></g></g>

<!-- 4. 看书 -->
<div class="scene" id="scene-read">

<!-- 5. 吃饭 -->

<rect class="et-shad" x="3" y="15" width="9" height="1" fill="#000" opacity=".5"/>
<g class="et-body"><g fill="#DE886D"><rect x="3" y="13" width="1" height="2"/><rect x="5" y="13" width="1" height="2"/><rect x="9" y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/></g><rect x="2" y="6" width="11" height="7" fill="#DE886D"/><g class="et-eye" fill="#000"><rect x="4" y="8" width="1" height="2"/><rect x="10" y="8" width="1" height="2"/></g><rect class="et-mouth" x="6.4" y="10.7" width="2.2" height="1.2" rx=".5" fill="#7a2230"/><rect x="-.4" y="10.4" width="2.6" height="2" fill="#DE886D" rx=".4" transform="rotate(34,1,11.4)"/><g class="et-arm"><rect x="13" y="9" width="2" height="2" fill="#DE886D"/><rect x="6.2" y="11.2" width="7.6" height=".5" rx=".25" fill="#C9A227" transform="rotate(-7,13,10)"/><rect x="6.2" y="12.3" width="7.6" height=".5" rx=".25" fill="#C9A227" transform="rotate(-7,13,10)"/><rect x="5.6" y="11" width="1.5" height="1.5" rx=".5" fill="#E8B04B" transform="rotate(-7,13,10)"/></g><g><g fill="#fff"><g class="et-steam" style="--sd:0s;--tx:-1px"><rect x="3.6" y="9.6" width=".7" height="2" rx=".35"/></g><g class="et-steam" style="--sd:-1s;--tx:1px"><rect x="5.6" y="9.6" width=".7" height="2" rx=".35"/></g></g><path d="M2 11.6 H9 L8 14 Q5.5 15 3 14 Z" fill="#3f7fd0"/><path d="M2 11.6 H9 V12.4 H2 Z" fill="#5a9aea"/><ellipse cx="5.5" cy="11.7" rx="3.2" ry="1.1" fill="#FBF6EE"/></g></g>
</svg>
</div>

<div class="scene" id="scene-exercise">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45">

<rect class="ex-shad" x="3" y="15" width="9" height="1" fill="#000" opacity=".5"/>
<g class="ex-body"><g fill="#DE886D"><rect x="3" y="13" width="1" height="2"/><rect x="5" y="13" width="1" height="2"/><rect x="9" y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/></g><rect x="2" y="6" width="11" height="7" fill="#DE886D"/><rect x="2" y="6.3" width="11" height="1.3" fill="#ff5555"/><rect x="2" y="6.3" width="11" height=".5" fill="#ff8888"/><g class="ex-al"><rect x="0" y="9" width="2" height="2" fill="#DE886D"/><rect x="-1.6" y="9.6" width="5.2" height=".9" fill="#222"/><rect x="-1.8" y="8.9" width="1" height="2.3" rx=".2" fill="#3a3a3a"/><rect x="2.8" y="8.9" width="1" height="2.3" rx=".2" fill="#3a3a3a"/></g><g class="ex-ar"><rect x="13" y="9" width="2" height="2" fill="#DE886D"/><rect x="11.4" y="9.6" width="5.2" height=".9" fill="#222"/><rect x="11.2" y="8.9" width="1" height="2.3" rx=".2" fill="#3a3a3a"/><rect x="15.8" y="8.9" width="1" height="2.3" rx=".2" fill="#3a3a3a"/></g><g class="ex-eye" fill="#000"><rect x="4" y="8" width="1" height="2"/><rect x="10" y="8" width="1" height="2"/></g></g>

<div class="scene" id="scene-sleep">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45">
<g fill="#8ca8e0"><g class="sp-z" style="--delay:0s;--d:2s;--tx:5px"><text x="11" y="5" font-size="3.5" font-weight="700" fill="#8ca8e0">Z</text></g><g class="sp-z" style="--delay:-.9s;--d:2.5s;--tx:4px"><text x="14" y="0" font-size="2.8" font-weight="700" fill="#a0b8e8">z</text></g></g>

<div class="scene" id="scene-drink">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45">
<rect class="dr-shad" x="3" y="15" width="9" height="1" fill="#000" opacity=".5"/>
<g class="dr-body"><g fill="#DE886D"><rect x="3" y="13" width="1" height="2"/><rect x="5" y="13" width="1" height="2"/><rect x="9" y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/></g><rect x="2" y="6" width="11" height="7" fill="#DE886D"/><g class="dr-eye" fill="#000"><rect x="4" y="8" width="1" height="2"/><rect x="10" y="8" width="1" height="2"/></g><rect x="-.2" y="10.5" width="2.5" height="1.5" fill="#DE886D" rx=".3" transform="rotate(30,1,11.5)"/><g class="dr-arm"><rect x="13" y="9" width="2" height="2" fill="#DE886D"/><rect x="8" y="10.5" width="7" height=".4" rx=".2" fill="#DE886D"/><polygon points="3.8,11.5 5.2,8.2 10.5,8.8 10.2,11.8" fill="#6ad4f0"/><rect x="5" y="8" width="5.5" height=".6" rx=".3" fill="#8ae4ff"/><g class="dr-water"><rect x="5.5" y="8.5" width="4" height="1.8" rx=".4" fill="#4ad4ff" opacity=".7"/></g></g></g>
</svg>
</div>

<script>
var petEngine = {
  currentScene: 'listen',
  
  scenes: ['listen','game','sing','read','eat','exercise','sleep','drink'],
  
  init: function(){
    var self = this;
    // 找所有场景div
    this.sceneEls = {};
    this.scenes.forEach(function(s){
      self.sceneEls[s] = document.getElementById('scene-'+s);
    });
    this.bubbleEl = document.getElementById('bubble');
    this.bubbleTimer = null;
    // 初始场景
    this.setScene('listen');
  },
  
  setScene: function(name){
    if (!this.sceneEls[name]) return;
    // 隐藏当前
    var cur = document.querySelector('.scene.active');
    if (cur) cur.classList.remove('active');
    // 显示新场景
    this.sceneEls[name].classList.add('active');
    this.currentScene = name;
  },
  
  getScene: function(){
    return this.currentScene;
  },
  
  showBubble: function(text, style){
    var self = this;
    style = style || 'normal';
    this.bubbleEl.textContent = text;
    this.bubbleEl.className = style + ' show';
    if (this.bubbleTimer) clearTimeout(this.bubbleTimer);
    this.bubbleTimer = setTimeout(function(){
      self.bubbleEl.classList.remove('show');
    }, 2800);
  },
  
  onTap: function(){
    // 戳一戳反馈：弹跳 + 随机爱心 + 气泡
    var cur = document.querySelector('.scene.active svg');
    if (cur) {
      cur.classList.remove('poke');
      void cur.offsetWidth;
      cur.classList.add('poke');
    }
    var replies = ['嗯？','干嘛啦','戳我干嘛','再戳一下试试','痒','嘿！','🦀','别闹'];
    var r = replies[Math.floor(Math.random()*replies.length)];
    this.showBubble(r,'normal');
    this.spawnHeart();
  },
  
  onDoubleTap: function(){
    var replies = ['啊啊','好害羞','你别这样','///','❤️','过分了！'];
    var r = replies[Math.floor(Math.random()*replies.length)];
    this.showBubble(r,'love');
  },
  
  onLongPress: function(){
    var replies = ['……松手','你捏够了没','呜呜','QAQ'];
    var r = replies[Math.floor(Math.random()*replies.length)];
    this.showBubble(r,'angry');
  },
  
  spawnHeart: function(){
    var h = document.createElement('div');
    h.className = 'heart-pop';
    var hearts = ['❤️','💕','💗','✨','🦀','💢'];
    h.textContent = hearts[Math.floor(Math.random()*hearts.length)];
    h.style.left = (30 + Math.random()*60) + 'px';
    h.style.top = (20 + Math.random()*40) + 'px';
    document.body.appendChild(h);
    setTimeout(function(){ h.remove(); }, 950);
  },
  
  // 从Android端调用：随机切换场景
  switchRandom: function(){
    var others = this.scenes.filter(function(s){ return s !== this; }.bind(this.currentScene));
    var pick = others[Math.floor(Math.random()*others.length)];
    this.setScene(pick);
  }
};

petEngine.init();
</script>
</body>
</html>
